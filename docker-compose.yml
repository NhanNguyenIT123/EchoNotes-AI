services:
  postgres:
    image: postgres:16-alpine
    container_name: echonotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echonotes
      POSTGRES_USER: echonotes
      POSTGRES_PASSWORD: echonotes
    ports:
      - "5432:5432"
    volumes:
      - echonotes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echonotes -d echonotes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  echonotes_postgres_data:
